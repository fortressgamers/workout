<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1115">
<title>Workout Tracker Pro</title>
<style>
:root{
  --bg:#0f1115;
  --card:#171b22;
  --card2:#1f2630;
  --text:#f3f6fb;
  --muted:#aab4c0;
  --accent:#7c5cff;
  --accent2:#22c55e;
  --danger:#ef4444;
  --line:#2b3442;
  --chip:#121821;
}
*{box-sizing:border-box}
body{
  font-family:Arial,sans-serif;
  background:linear-gradient(180deg,#0f1115,#121827);
  color:var(--text);
  max-width:1050px;
  margin:auto;
  padding:20px
}
h1{margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 18px}
.topbar{
  background:var(--card);
  border:1px solid var(--line);
  padding:14px;
  border-radius:16px;
  box-shadow:0 8px 24px rgba(0,0,0,.18);
  display:grid;
  gap:10px;
  margin-bottom:16px
}
progress{
  width:100%;
  height:22px;
  border-radius:999px;
  overflow:hidden
}
progress::-webkit-progress-bar{background:#263041;border-radius:999px}
progress::-webkit-progress-value{background:linear-gradient(90deg,var(--accent),#39b6ff);border-radius:999px}
progress::-moz-progress-bar{background:linear-gradient(90deg,var(--accent),#39b6ff)}
button{
  padding:10px 14px;
  border-radius:10px;
  border:none;
  cursor:pointer;
  background:var(--accent);
  color:white;
  font-weight:700
}
button.secondary{background:#334155}
button.danger{background:var(--danger)}
.row{display:flex;gap:8px;flex-wrap:wrap}

.segment{
  display:flex;
  width:100%;
  background:#10141c;
  border:1px solid #2b3442;
  border-radius:999px;
  overflow:hidden;
  padding:4px;
}
.segment button{
  flex:1;
  background:transparent;
  color:var(--muted);
  border-radius:999px;
  padding:12px 14px;
  font-size:1rem;
  transition:.2s ease;
}
.segment button.active{
  background:var(--accent);
  color:#fff;
}

.week-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:8px
}
.week-grid button{
  width:100%;
  background:var(--chip);
  border:1px solid #374151;
  border-radius:999px;
  padding:12px 10px;
  font-size:1rem;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px
}
.week-grid button:hover{border-color:#596579}

.badge{
  padding:4px 10px;
  border:1px solid #374151;
  border-radius:999px;
  background:#121821;
  font-size:.95rem
}
.badge.done{
  background:#17361f;
  border-color:#2d7a41
}

details{
  background:var(--card);
  padding:10px;
  margin:12px 0;
  border:1px solid var(--line);
  border-radius:16px
}
summary{
  font-weight:800;
  font-size:1.08em;
  cursor:pointer;
  list-style:none
}
summary::-webkit-details-marker{display:none}

.daybox{
  background:var(--card2);
  border:1px solid #2a3340;
  border-radius:14px;
  padding:12px;
  margin:12px 0
}
.dayhead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap
}
.dayhead h3{
  margin:0;
  display:flex;
  align-items:center;
  gap:8px
}
label{
  display:block;
  margin:8px 0;
  line-height:1.45
}
input[type=checkbox]{
  transform:scale(1.15);
  margin-right:8px;
  accent-color:var(--accent2)
}
.small{color:var(--muted);font-size:.95em}
.kpi{font-size:1.05em;font-weight:700}
.daybadge{min-width:34px;text-align:center}
.controls{margin-top:10px}

.tab-content{display:none}
.tab-content.active{display:block}
</style>
</head>

let currentTab = "workout";

function planKey(){ return plans[currentTab].storageKey; }
function planWeeks(){ return plans[currentTab].weeks; }
function allBoxes(){ return [...document.querySelectorAll(`#${currentTab}Tab input[type="checkbox"]`)]; }

function renderWeekButtons(){
  const grid = document.getElementById("weekGrid");
  grid.innerHTML = "";
  Object.keys(planWeeks()).forEach(weekName => {
    const btn = document.createElement("button");
    const weekId = weekName.replace(/s+/g, "_");
    btn.id = `top-week-${currentTab}-${weekId}`;
    btn.onclick = () => openWeek(weekName);
    btn.innerHTML = `<span class="badge">⭕</span> ${weekName}`;
    grid.appendChild(btn);
  });
}

function renderPlan(tab){
  const container = document.getElementById(`${tab}Content`);
  container.innerHTML = "";
  const weeks = plans[tab].weeks;

  for(const [weekName, days] of Object.entries(weeks)){
    const details = document.createElement("details");
    details.id = `${tab}_${weekName.replace(/s+/g, "_")}`;
    details.open = false;
    details.innerHTML = `<summary>${weekName}</summary>`;

    for(const [dayName, items] of Object.entries(days)){
      const box = document.createElement("div");
      box.className = "daybox";
      const dayId = `${details.id}-${dayName.replace(/s+/g, "_")}`;
      box.innerHTML = `
        <div class="dayhead">
          <h3>${dayName} <span class="badge daybadge" id="${tab}-day-badge-${dayId}">⭕</span></h3>
          <div class="small">${items.length} items</div>
        </div>
      `;

      items.forEach((item, idx) => {
        const id = `${tab}__${weekName}__${dayName}__${idx}`;
        const label = document.createElement("label");
        label.innerHTML = `<input type="checkbox" id="${id}"> ${item}`;
        box.appendChild(label);
      });

      const btnRow = document.createElement("div");
      btnRow.className = "row controls";

      const completeBtn = document.createElement("button");
      completeBtn.textContent = "Mark Day Complete";
      completeBtn.onclick = () => {
        box.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = true);
        saveAndUpdate();
      };

      const clearBtn = document.createElement("button");
      clearBtn.textContent = "Clear Day";
      clearBtn.className = "secondary";
      clearBtn.onclick = () => {
        box.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
        saveAndUpdate();
      };

      btnRow.appendChild(completeBtn);
      btnRow.appendChild(clearBtn);
      box.appendChild(btnRow);
      details.appendChild(box);
    }

    container.appendChild(details);
  }
}

function openWeek(weekName){
  const el = document.getElementById(`${currentTab}_${weekName.replace(/s+/g, "_")}`);
  if(el){ el.open = true; el.scrollIntoView({behavior:"smooth", block:"start"}); }
}

function showTab(tab){
  currentTab = tab;
  document.getElementById("workoutTab").classList.toggle("active", tab === "workout");
  document.getElementById("gymTab").classList.toggle("active", tab === "gym");
  document.getElementById("tabBtnWorkout").classList.toggle("active", tab === "workout");
  document.getElementById("tabBtnGym").classList.toggle("active", tab === "gym");
  renderWeekButtons();
  renderPlan(tab);
  loadState();
  update();
}

function loadState(){
  const saved = JSON.parse(localStorage.getItem(planKey()) || "{}");
  allBoxes().forEach(cb => {
    cb.checked = !!saved[cb.id];
    cb.onchange = saveAndUpdate;
  });
}

function saveAndUpdate(){
  const saved = {};
  allBoxes().forEach(cb => saved[cb.id] = cb.checked);
  localStorage.setItem(planKey(), JSON.stringify(saved));
  update();
}

function update(){
  const boxes = allBoxes();
  const checked = boxes.filter(b => b.checked).length;
  const pct = boxes.length ? Math.round((checked / boxes.length) * 100) : 0;
  document.getElementById("overall").textContent = `Overall Progress: ${pct}% (${checked}/${boxes.length})`;
  document.getElementById("bar").value = pct;

  for(const [weekName, days] of Object.entries(planWeeks())){
    const weekId = weekName.replace(/s+/g, "_");
    const weekBoxes = boxes.filter(cb => cb.id.includes(`__${weekName}__`));
    const weekDone = weekBoxes.length > 0 && weekBoxes.every(cb => cb.checked);
    const topBtn = document.getElementById(`top-week-${currentTab}-${weekId}`);
    if(topBtn) topBtn.innerHTML = `<span class="badge ${weekDone ? 'done' : ''}">${weekDone ? '🏆' : '⭕'}</span> ${weekName}`;

    for(const [dayName, items] of Object.entries(days)){
      const dayId = `${currentTab}_${weekId}-${dayName.replace(/s+/g, "_")}`;
      const dayBoxes = items.map((_, i) => document.getElementById(`${currentTab}__${weekName}__${dayName}__${i}`));
      const dayDone = dayBoxes.length > 0 && dayBoxes.every(cb => cb && cb.checked);
      const dayBadge = document.getElementById(`${currentTab}-day-badge-${dayId}`);
      if(dayBadge) dayBadge.textContent = dayDone ? "🏆" : "⭕";
    }
  }
}

function resetAll(){
  if(confirm("Reset all progress for this tab?")){
    allBoxes().forEach(cb => cb.checked = false);
    localStorage.removeItem(planKey());
    update();
  }
}

showTab("workout");
